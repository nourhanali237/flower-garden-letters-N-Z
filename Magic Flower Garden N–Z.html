<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Magic Flower Garden N–Z</title>
<style>
:root{color-scheme:light dark;--s1:#59bff2;--s2:#cdf1ff;--ink:#2b4a2a;--cr:#fff8e6;--ln:#e6c98e;--acc:#ff6fa5;--ok:#35a853;--pn:#fff8e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--s1:#14264d;--s2:#365a8a;--ink:#eaf7ea;--cr:#38493a;--ln:#6b7f5a;--pn:#2c3d2f}}
:root[data-theme="dark"]{--s1:#14264d;--s2:#365a8a;--ink:#eaf7ea;--cr:#38493a;--ln:#6b7f5a;--pn:#2c3d2f}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;height:100%}
body{background:linear-gradient(var(--s1),var(--s2) 70%);background-attachment:fixed;color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;overflow-x:hidden}
#app{min-height:100%;display:flex;flex-direction:column}
#scene{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
#scene .hills{position:absolute;left:0;bottom:0;width:100%;height:45vh}
#scene .sun{position:absolute;right:4%;top:70px;width:110px;animation:spin 60s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.dc{position:absolute;animation:drift 70s linear infinite;opacity:.92}
@keyframes drift{from{transform:translateX(-200px)}to{transform:translateX(110vw)}}
.tr{position:absolute;transform-origin:50% 100%;animation:swy 6s ease-in-out infinite alternate}
@keyframes swy{to{transform:rotate(2deg)}}
.pt i{position:absolute;bottom:-10px;width:6px;height:6px;border-radius:50%;background:#fff6a8;box-shadow:0 0 8px #ffe66d;animation:rise linear infinite}
@keyframes rise{to{transform:translate(30px,-105vh);opacity:0}}
header,main,#bar{width:100%;max-width:900px;margin:0 auto;padding:8px 14px}
main{flex:1}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font-size:1.5rem;font-weight:900;color:#fff;text-shadow:0 2px 0 #c2417d,0 3px 8px rgba(0,0,0,.3);line-height:1}
.logo svg{width:44px;height:44px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25))}
.logo small{display:block;font-size:.8rem;color:#fff8a8;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.pill{display:flex;align-items:center;gap:6px;background:var(--cr);border:3px solid var(--ln);border-radius:30px;padding:3px 12px 3px 6px;font-weight:900;font-size:1.2rem}
.pill svg{width:30px;height:30px}
.cb{font:inherit;font-weight:800;color:#fff;border:0;border-radius:18px;padding:10px 18px;background:linear-gradient(#ff8fbd,#ee4f8f);--sh:#b5336a;box-shadow:0 5px 0 var(--sh),0 8px 14px rgba(0,0,0,.2);cursor:pointer;transition:transform .12s,box-shadow .12s}
.cb:hover{transform:translateY(-2px)}
.cb:active{transform:translateY(4px);box-shadow:0 1px 0 var(--sh)}
.cb.g{background:linear-gradient(#6fd67f,#2fa04a);--sh:#1f7a35}
.cb.b{background:linear-gradient(#6cc3ff,#2f8fe0);--sh:#1d65a8}
.cb.o{background:linear-gradient(#ffc45c,#f08c1a);--sh:#b26208}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.tab{font:inherit;font-weight:800;color:var(--ink);background:var(--cr);border:3px solid var(--ln);border-radius:18px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;box-shadow:0 4px 0 var(--ln);transition:transform .15s}
.tab svg{width:34px;height:34px}
.tab span{font-size:.85rem}
.tab:hover{transform:translateY(-2px)}
.tab.on{background:linear-gradient(#ff9ac2,#ee5a98);color:#fff;border-color:#c2417d;box-shadow:0 4px 0 #a02f66;transform:translateY(-3px)}
#pw{display:flex;align-items:center;gap:10px}
#pb{flex:1;height:18px;background:rgba(255,255,255,.55);border:3px solid var(--ln);border-radius:12px;overflow:hidden}
#pb i{display:block;height:100%;width:0;background:repeating-linear-gradient(45deg,#6fd67f 0 10px,#4cbf63 10px 20px);border-radius:8px;transition:width .6s}
#pt{font-size:.85rem;font-weight:800;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5);white-space:nowrap}
#stage{background:radial-gradient(circle,rgba(255,255,255,.5) 2px,transparent 3px) 0 0/58px 46px,linear-gradient(#9be07a,#5fb552);border:4px solid #3f9b4a;border-radius:28px;padding:14px 10px;min-height:360px;text-align:center;box-shadow:0 8px 0 #2f7d3a,0 14px 24px rgba(0,0,0,.25)}
.ins{display:inline-block;background:var(--cr);color:var(--ink);border:3px solid var(--ln);border-radius:20px;padding:8px 16px;font-weight:800;font-size:1.1rem;margin:0 0 10px}
.pic{display:inline-flex;flex-direction:column;align-items:center;background:var(--cr);border:3px solid var(--ln);border-radius:20px;padding:4px 26px 6px;box-shadow:0 4px 0 var(--ln)}
.big{font-size:56px;line-height:1.1}
.pic b{font-size:1.1rem;color:var(--ink)}
.gd{position:relative;padding-top:115px;margin-top:6px}
#cloud{position:absolute;left:0;top:0;width:clamp(150px,34vw,210px);transition:transform 1s ease;filter:drop-shadow(0 6px 6px rgba(40,70,110,.35))}
#cloud svg{display:block;width:100%}
#cloud.rain svg{animation:shk .18s infinite alternate}
@keyframes shk{from{transform:translateY(0)}to{transform:translateY(3px)}}
.row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.fl{display:flex;flex-direction:column;align-items:center;width:148px;padding:4px;background:transparent;border:2px dashed transparent;border-radius:18px;cursor:pointer;font:inherit}
.fs{width:124px;height:161px;overflow:visible}
.sway{transform-origin:50px 128px;animation:sw 4s ease-in-out infinite alternate}
@keyframes sw{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}
.bl{transform-origin:50px 52px}
.bloom{animation:bl 1s ease-out}
@keyframes bl{0%{transform:scale(.2) rotate(-40deg)}60%{transform:scale(1.25) rotate(10deg)}100%{transform:scale(1)}}
.bed{width:136px;height:30px;margin-top:-22px;border-radius:50%;background:radial-gradient(#8a5a2b,#5e3b19)}
.sign{margin-top:-6px;position:relative;background:linear-gradient(#e8b06a,#b87333);color:#fff;border:2px solid #7a4a1e;border-radius:8px;padding:3px 18px;font-weight:900;font-size:2.1rem;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.drop{position:absolute;top:88px;width:6px;height:28px;border-radius:3px 3px 50% 50%;background:linear-gradient(rgba(170,220,255,.15),#3d9be8 65%,#1f6fc0);box-shadow:inset 1px 0 1px rgba(255,255,255,.8),0 0 4px rgba(61,155,232,.5);transform:rotate(6deg);pointer-events:none}
.wig{animation:wig .5s}
@keyframes wig{20%{transform:rotate(-10deg)}40%{transform:rotate(10deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(6deg)}}
.glow{border-color:#fff;background:rgba(255,255,255,.35);box-shadow:0 0 18px #fff}
.hint{min-height:50px;margin-top:10px;font-size:1.05rem;font-weight:800;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.hint .ok{color:#fff8a8;font-size:1.2rem}
.hint button{margin-left:8px;padding:6px 14px;text-shadow:none}
.cols{display:flex;gap:26px;justify-content:center;flex-wrap:nowrap}
.col{display:flex;flex-direction:column;gap:12px;width:min(44%,230px)}
.opt{font:inherit;color:var(--ink);width:100%;height:108px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:2.2rem;font-weight:900;padding:6px;background:var(--cr);border:3px solid var(--ln);border-radius:18px;box-shadow:0 5px 0 var(--ln);cursor:pointer;transition:transform .15s}
.opt:hover{transform:translateY(-2px)}
.opt small{display:block;font-size:1.05rem;margin-top:2px}
.opt.sel{background:linear-gradient(#ff9ac2,#ee5a98);color:#fff;border-color:#c2417d;box-shadow:0 5px 0 #a02f66;transform:scale(1.08)}
.opt.ok,.slot.ok{background:linear-gradient(#6fd67f,#2fa04a);color:#fff;border-color:#1f7a35;box-shadow:0 5px 0 #1f7a35;pointer-events:none}
.strip{display:inline-block;background:rgba(255,255,255,.4);border-radius:12px;padding:2px 12px;letter-spacing:5px;font-size:1rem;font-weight:800;color:#fff;margin:4px 0}
.slots,.tiles{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.slot{position:relative;width:62px;height:62px;border:4px dashed #e8e0c8;background:rgba(150,120,80,.45);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.8rem;font-weight:900;color:#fff}
.slot:not(:last-child)::after{content:"›";position:absolute;right:-14px;color:#fff;font-size:1.4rem}
.tile{font:inherit;width:62px;height:62px;font-size:1.8rem;font-weight:900;padding:0;color:#fff;background:linear-gradient(#ffc45c,#f08c1a);border:3px solid #b26208;border-radius:16px;box-shadow:0 5px 0 #b26208;cursor:pointer;transition:transform .15s}
.tile:hover{transform:translateY(-3px)}
.mem{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;max-width:720px;margin:10px auto}
.card{font:inherit;perspective:600px;background:none;border:0;padding:0;height:124px;width:100%;cursor:pointer}
.in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.card.up .in{transform:rotateY(180deg)}
.fa,.fb{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;border:3px solid var(--ln)}
.fa{background:linear-gradient(#ff9ac2,#e0559c);border-color:#c2417d}
.nm{font-size:2rem;font-weight:900;color:#fff;text-shadow:0 2px 0 #c2417d;line-height:1;margin-top:2px}
.fb{transform:rotateY(180deg);background:var(--cr);font-size:2.2rem;font-weight:900;color:var(--ink);line-height:1.1}
.fb small{font-size:1rem}
.card.ok{pointer-events:none}
.card.ok .fb{background:#c8f5cf;border-color:var(--ok);color:#1c5a2a;animation:pop .6s}
@keyframes pop{50%{transform:rotateY(180deg) scale(1.12)}}
#bar{display:flex;gap:12px;justify-content:center;padding-bottom:16px}
#msg,#teach{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:9;padding:16px}
.box{background:var(--pn);color:var(--ink);border:4px solid var(--ln);border-radius:26px;padding:22px;max-width:440px;width:100%;text-align:center;box-shadow:0 8px 0 var(--ln)}
.box h2{margin:6px 0}
.box .cb{margin:8px 4px 4px}
.bs svg{width:90px;height:90px;animation:pop2 .8s ease-out}
@keyframes pop2{0%{transform:scale(.1) rotate(-90deg)}70%{transform:scale(1.25) rotate(10deg)}100%{transform:scale(1)}}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.kp div{background:var(--cr);border:2px solid var(--ln);border-radius:14px;padding:8px;font-size:.85rem}
.kp b{display:block;font-size:1.7rem}
.ac{text-align:left;margin:8px 0}
.ac div{display:flex;justify-content:space-between;padding:6px 10px;border-bottom:2px dotted var(--ln)}
.ch{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0}
.ch i{font-style:normal;font-weight:900;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(128,128,128,.2);opacity:.55}
.ch i.on{background:var(--ok);color:#fff;opacity:1}
.fxs{position:fixed;left:0;top:0;pointer-events:none;z-index:8;text-shadow:0 0 6px #fff}
.flap{display:inline-block}
.wg{transform-origin:30px 25px;animation:fp .25s infinite alternate}
@keyframes fp{to{transform:scaleX(.3)}}
@media (max-width:560px){.logo{font-size:1.15rem}.logo svg{width:36px;height:36px}.tab span{font-size:.7rem}.tab svg{width:28px;height:28px}.fl{width:46%}.card{height:86px}.fb{font-size:1.25rem}.nm{font-size:1.3rem}.fb small{font-size:.62rem}.mem{gap:6px}.ins{font-size:1rem}#pt{font-size:.75rem}#scene .sun{width:70px;top:110px}.tr.t2{display:none}.opt{height:88px;font-size:1.7rem}.opt small{font-size:.85rem}.col{width:44%}}
@media (prefers-reduced-motion:reduce){.dc,.sun,.pt i,.tr,.sway{animation:none}}
</style></head><body>
<div id="scene"></div>
<div id="app">
<header>
 <div class="top"><div class="logo" id="logo"></div><span class="pill" id="stars"></span><button class="cb o" id="tb">Teacher</button></div>
 <div class="tabs" id="tabs"></div>
 <div id="pw"><div id="pb"><i></i></div><div id="pt"></div></div>
</header>
<main><div id="stage"></div></main>
<div id="bar"><button class="cb b" id="rs">Restart</button><button class="cb g" id="nx">Next activity ▶</button></div>
</div>
<div id="msg"><div class="box" id="mb"></div></div>
<div id="teach"><div class="box" id="tbx"></div></div>
<script>
const L=[["N","Nest","🪺"],["O","Owl","🦉"],["P","Pig","🐷"],["Q","Queen","👑"],["R","Rabbit","🐰"],["S","Sun","☀️"],["T","Tree","🌳"],["U","Umbrella","☂️"],["V","Violin","🎻"],["W","Whale","🐋"],["X","X-ray","🩻"],["Y","Yo-yo","🪀"],["Z","Zebra","🦓"]].map(a=>({c:a[0],w:a[1],e:a[2]}));
const NAMES=["Flower Garden","Match","Memory"];
const $=s=>document.querySelector(s),sh=a=>[...a].sort(()=>Math.random()-.5),wait=ms=>new Promise(r=>setTimeout(r,ms));
const P=[0,0,0],M=new Set();let cur=0,st={},tm=[];
const lc=o=>o.c+" "+o.c.toLowerCase();
/* ---------- art ---------- */
const COL=["#ff6fa5","#ff9a3c","#b078ff","#ff5e5e","#4db6ff"];
const pet=(c,n=8,r=16)=>Array.from({length:n},(_,i)=>`<ellipse cy="-${r+2}" rx="9" ry="${r}" fill="${c}" transform="rotate(${i*360/n})"/>`).join("");
const flo=c=>`<svg class="fs" viewBox="0 0 100 130"><g class="sway"><path d="M50 128V62" stroke="#3f9b4a" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M50 112q-26-4-30-24q22-2 30 24z" fill="#58b85a"/><path d="M50 100q26-4 30-22q-22-2-30 22z" fill="#46a44f"/><g class="bud"><ellipse cx="50" cy="50" rx="13" ry="20" fill="${c}"/><path d="M50 32q-14 10-8 30q8-8 8-30z" fill="#fff" opacity=".28"/><path d="M37 64q13 10 26 0q-2 9-13 9t-13-9z" fill="#46a44f"/></g><g class="bl" style="display:none"><g transform="translate(50 52)">${pet(c)}<circle r="11" fill="#ffd54a"/><circle r="5" cx="-3" cy="-3" fill="#ffe98a"/></g></g></g></svg>`;
const mini=(c,k=6,r=8,w=44)=>`<svg viewBox="-30 -30 60 60" width="${w}" height="${w}"><g>${pet(c,k,r)}<circle r="6" fill="#ffd54a"/></g></svg>`;
const CLD='<svg viewBox="0 0 120 60"><g fill="#fff"><ellipse cx="35" cy="38" rx="28" ry="18"/><ellipse cx="65" cy="30" rx="30" ry="22"/><ellipse cx="92" cy="40" rx="24" ry="16"/></g></svg>';
const RC='<svg viewBox="0 0 200 110"><defs><linearGradient id="rg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#e3edf7"/><stop offset="1" stop-color="#9fb3c8"/></linearGradient><linearGradient id="rg2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c5d3e2"/><stop offset="1" stop-color="#7d92a8"/></linearGradient></defs><g fill="url(#rg2)"><ellipse cx="55" cy="72" rx="42" ry="26"/><ellipse cx="100" cy="76" rx="50" ry="26"/><ellipse cx="150" cy="72" rx="40" ry="24"/></g><g fill="url(#rg)"><ellipse cx="45" cy="62" rx="34" ry="26"/><ellipse cx="82" cy="42" rx="38" ry="34"/><ellipse cx="124" cy="46" rx="36" ry="30"/><ellipse cx="156" cy="62" rx="32" ry="24"/><ellipse cx="100" cy="66" rx="54" ry="24"/></g><g fill="#fff" opacity=".75"><ellipse cx="70" cy="30" rx="16" ry="8"/><ellipse cx="120" cy="34" rx="14" ry="7"/></g></svg>';
const BF='<svg viewBox="0 0 60 50" width="46"><g class="wg"><ellipse cx="17" cy="17" rx="15" ry="13" fill="#ff9a3c"/><ellipse cx="43" cy="17" rx="15" ry="13" fill="#ff9a3c"/><ellipse cx="20" cy="35" rx="10" ry="9" fill="#ffc34d"/><ellipse cx="40" cy="35" rx="10" ry="9" fill="#ffc34d"/><circle cx="17" cy="17" r="4" fill="#fff" opacity=".7"/><circle cx="43" cy="17" r="4" fill="#fff" opacity=".7"/></g><rect x="27" y="10" width="6" height="32" rx="3" fill="#5a3b1e"/></svg>';
const STAR='<svg viewBox="0 0 50 48"><path d="M25 2l6.5 14 15 1.7-11.2 10.3 3.1 15L25 35.4 11.6 43l3.1-15L3.5 17.7l15-1.7z" fill="#ffc82e" stroke="#e59a00" stroke-width="2" stroke-linejoin="round"/></svg>';
const TREE=`<svg viewBox="0 0 80 120"><rect x="34" y="70" width="12" height="50" rx="4" fill="#8a5a2b"/><circle cx="40" cy="48" r="30" fill="#3f9b4a"/><circle cx="24" cy="62" r="20" fill="#4fae55"/><circle cx="58" cy="60" r="20" fill="#4fae55"/><circle cx="34" cy="38" r="10" fill="#7bd06f" opacity=".6"/></svg>`;
const ICON=[mini("#ff6fa5",6,8,34),'<svg viewBox="0 0 40 40"><rect x="3" y="8" width="14" height="22" rx="4" fill="#ffc45c"/><rect x="23" y="8" width="14" height="22" rx="4" fill="#6cc3ff"/><path d="M17 19h6" stroke="#2b4a2a" stroke-width="3" stroke-linecap="round"/></svg>','<svg viewBox="0 0 40 40"><rect x="6" y="4" width="28" height="32" rx="6" fill="#ee5a98"/><g transform="translate(20 20) scale(.45)">'+pet("#fff",6,10)+'<circle r="7" fill="#ffd54a"/></g></svg>'];
const MB=mini("#ffe3f0",6,8,42);
$("#scene").innerHTML=`<svg class="sun" viewBox="-60 -60 120 120"><g stroke="#ffd84a" stroke-width="6" stroke-linecap="round">${Array.from({length:12},(_,i)=>`<path d="M0-42V-56" transform="rotate(${i*30})"/>`).join("")}</g><circle r="34" fill="#ffd84a"/><circle r="24" fill="#ffe680"/></svg>
<div class="dc" style="top:8%;width:130px">${CLD}</div><div class="dc" style="top:20%;width:90px;animation-delay:-30s">${CLD}</div><div class="dc" style="top:14%;width:110px;animation-delay:-55s">${CLD}</div>
<div class="tr" style="left:-10px;bottom:13vh;width:130px">${TREE}</div><div class="tr t2" style="right:6px;bottom:11vh;width:105px;animation-delay:-3s">${TREE}</div>
<svg class="hills" viewBox="0 0 1000 300" preserveAspectRatio="none"><path d="M0 120Q250 40 500 110T1000 90V300H0Z" fill="#7cc96a"/><path d="M0 190Q300 130 600 190T1000 170V300H0Z" fill="#5fb552"/><path d="M0 250Q250 220 500 250T1000 240V300H0Z" fill="#4aa044"/></svg>
<div class="pt">${Array.from({length:14},()=>`<i style="left:${Math.random()*100}%;animation-duration:${9+Math.random()*10}s;animation-delay:-${Math.random()*15}s"></i>`).join("")}</div>`;
$("#logo").innerHTML=mini("#ff6fa5",8,12,44)+'<div>Magic Flower Garden<small>Letters N–Z</small></div>';
$("#stars").innerHTML=STAR+"<b>0</b>";
$("#tabs").innerHTML=NAMES.map((n,i)=>'<button class="tab" data-i="'+i+'">'+ICON[i]+'<span>'+n+'</span></button>').join("");
$("#tabs").onclick=e=>{const b=e.target.closest(".tab");if(b)go(+b.dataset.i)};
$("#rs").onclick=()=>start();$("#nx").onclick=()=>go((cur+1)%3);
/* ---------- core ---------- */
function upd(){$("#stars b").textContent=P.reduce((a,b)=>a+b,0);$("#pb i").style.width=M.size/13*100+"%";$("#pt").textContent=M.size+" of 13 letters learned (N–Z)";document.querySelectorAll(".tab").forEach((b,i)=>b.classList.toggle("on",i==cur))}
function go(i){cur=i;start()}
function start(){tm.forEach(clearTimeout);tm=[];document.querySelectorAll(".fxs").forEach(e=>e.remove());$("#msg").style.display="none";[garden,match,memory][cur]();upd()}
function wig(el){el.classList.remove("wig");void el.offsetWidth;el.classList.add("wig")}
function spark(x,y,n=10){for(let i=0;i<n;i++){const s=document.createElement("span");s.className="fxs";s.textContent=["✦","★","✧"][i%3];s.style.cssText="left:"+x+"px;top:"+y+"px;color:"+["#ffd23f","#ff7eb3","#7fd6ff"][i%3]+";font-size:"+(16+Math.random()*16)+"px";document.body.append(s);const a=Math.random()*6.28,d=40+Math.random()*80;s.animate([{transform:"translate(0,0) scale(.3)",opacity:1},{transform:"translate("+Math.cos(a)*d+"px,"+Math.sin(a)*d+"px) scale(1.3)",opacity:0}],{duration:1100+Math.random()*500}).onfinish=()=>s.remove()}}
function butterfly(x,y){const b=document.createElement("div");b.className="fxs";b.innerHTML='<span class="flap">'+BF+'</span>';document.body.append(b);const W=innerWidth-60,H=innerHeight-60,f=[{transform:"translate("+x+"px,"+y+"px)"}];for(let i=0;i<7;i++)f.push({transform:"translate("+Math.random()*W+"px,"+(40+Math.random()*(H-40))+"px)"});f.push({transform:"translate("+W+"px,-60px)",opacity:0});b.animate(f,{duration:6000,easing:"ease-in-out"}).onfinish=()=>b.remove()}
function inline(t,label,fn){$("#hint").innerHTML='<span class="ok">'+t+'</span> <button class="cb g" id="ib">'+label+'</button>';$("#ib").onclick=fn}
function showMsg(t,sub){$("#mb").innerHTML='<div class="bs">'+STAR+'</div><h2>'+t+'</h2><p>'+sub+'</p><button class="cb b" id="a1">Play again</button><button class="cb g" id="a2">Next activity ▶</button>';$("#msg").style.display="flex";$("#a1").onclick=start;$("#a2").onclick=()=>go((cur+1)%3)}
function done(){P[cur]++;upd();spark(innerWidth/2,innerHeight/2,24);cheer();party(innerWidth/2,innerHeight/2,32);showMsg("🎉 Amazing job! ❤️","You finished "+NAMES[cur]+" and earned a star!")}
function hint(t){$("#hint").textContent=t?"Hint: "+t:""}
let AC;function tone(f,t,d,ty="sine",v=.15){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=="suspended")AC.resume();const o=AC.createOscillator(),g=AC.createGain(),s=AC.currentTime+t;o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(v,s+.02);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+d+.05)}catch(e){}}
const ding=()=>[784,988,1175].forEach((f,i)=>tone(f,i*.09,.35));
const cheer=()=>[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,i*.12,.45,"triangle"));
function party(x,y,n=12){for(let i=0;i<n;i++){const s=document.createElement("span");s.className="fxs";s.textContent=["🎉","🎊","❤️","💖","⭐","🌟","💕"][i%7];s.style.cssText="left:"+x+"px;top:"+y+"px;font-size:"+(22+Math.random()*18)+"px";document.body.append(s);const a=(Math.random()-.5)*2.4,d=70+Math.random()*120,dx=Math.sin(a)*d,dy=-Math.abs(Math.cos(a))*d;s.animate([{transform:"translate(0,0) scale(.3)",opacity:1},{transform:"translate("+dx+"px,"+(dy-40)+"px) scale(1.2)",opacity:1,offset:.6},{transform:"translate("+dx*1.2+"px,"+(dy-90)+"px) scale(1)",opacity:0}],{duration:1500+Math.random()*700,easing:"ease-out"}).onfinish=()=>s.remove()}}
function win(x,y){ding();party(x,y,12)}

/* 1. Flower Garden */
function garden(){st={q:sh(L).slice(0,6),i:0};gRound()}
function gRound(){const t=st.q[st.i];st.wrong=0;st.lock=false;
 const o=sh([t,...sh(L.filter(x=>x!==t)).slice(0,3)]);
 $("#stage").innerHTML='<div class="ins">Round '+(st.i+1)+' of 6 · Water the flower with the letter <b>'+lc(t)+'</b>!</div><br><div class="pic"><span class="big">'+t.e+'</span><b>'+t.w+'</b></div><div class="gd" id="gd"><div id="cloud">'+RC+'</div><div class="row">'+o.map((x,i)=>'<button class="fl" data-c="'+x.c+'">'+flo(COL[i])+'<span class="bed"></span><span class="sign">'+lc(x)+'</span></button>').join("")+'</div></div><div class="hint" id="hint">Tap a flower to send the rain cloud!</div>';
 document.querySelectorAll(".fl").forEach(b=>b.onclick=()=>gPick(b,t))}
async function gPick(b,t){if(st.lock)return;
 if(b.dataset.c!==t.c){st.wrong++;wig(b);hint("Not this one. Look at the big letter "+t.c+" and try again!");if(st.wrong>=2)document.querySelectorAll(".fl").forEach(x=>x.classList.toggle("glow",x.dataset.c===t.c));return}
 st.lock=true;const gd=$("#gd"),g=gd.getBoundingClientRect(),f=b.getBoundingClientRect(),cx=f.left+f.width/2-g.left;
 const cw=$("#cloud").offsetWidth;$("#cloud").style.transform="translate("+(cx-cw/2)+"px,0)";await wait(1000);$("#cloud").classList.add("rain");
 for(let i=0;i<55;i++){const d=document.createElement("span");d.className="drop";d.style.left=(cx-cw*.38+Math.random()*cw*.76)+"px";d.style.height=(24+Math.random()*16)+"px";d.style.width=(5+Math.random()*3)+"px";gd.append(d);d.animate([{transform:"translate(0,0) rotate(6deg)",opacity:0},{opacity:.9,offset:.15},{transform:"translate(-10px,135px) rotate(6deg)",opacity:.8}],{duration:550+Math.random()*350,delay:Math.random()*1500,fill:"backwards"}).onfinish=()=>d.remove()}
 await wait(2000);$("#cloud").classList.remove("rain");b.querySelector(".bud").style.display="none";const bl=b.querySelector(".bl");bl.style.display="";bl.classList.add("bloom");
 const r=b.querySelector("svg").getBoundingClientRect();spark(r.left+r.width/2,r.top+r.height*.4,14);butterfly(r.left+r.width/2,r.top);win(r.left+r.width/2,r.top+r.height*.4);M.add(t.c);upd();
 const last=st.i==5;inline("Wonderful! 🎉❤️ "+t.c+" is for "+t.w+"!",last?"Finish ▶":"Next flower ▶",()=>{if(last)done();else{st.i++;gRound()}})}

/* 2. Match */
function match(){const q=sh(L).slice(0,4);st={sel:null,left:4};let lf,rt;do{lf=sh(q);rt=sh(q)}while(lf.some((x,i)=>x===rt[i]));
 $("#stage").innerHTML='<div class="ins">Tap a letter, then tap the picture that starts with it.</div><div class="cols"><div class="col">'+lf.map(x=>'<button class="opt" data-t="l" data-c="'+x.c+'">'+lc(x)+'</button>').join("")+'</div><div class="col">'+rt.map(x=>'<button class="opt" data-t="p" data-c="'+x.c+'">'+x.e+'<small>'+x.w+'</small></button>').join("")+'</div></div><div class="hint" id="hint"></div>';
 document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>mPick(b))}
function mPick(b){const s=st.sel;
 if(!s||s.dataset.t===b.dataset.t){if(s)s.classList.remove("sel");st.sel=b;b.classList.add("sel");return}
 s.classList.remove("sel");st.sel=null;
 if(s.dataset.c===b.dataset.c){[s,b].forEach(x=>x.classList.add("ok"));const r=b.getBoundingClientRect();spark(r.left,r.top+20,10);win(r.left,r.top+20);M.add(b.dataset.c);upd();hint("");$("#hint").innerHTML='<span class="ok">Great match! 🎉❤️</span>';if(--st.left==0)tm.push(setTimeout(done,900))}
 else{[s,b].forEach(wig);hint("Not a match. Say the picture word in your mind and look at its first letter!")}}


/* 4. Memory */
function memory(){const q=sh(L).slice(0,5);st={open:[],left:5,moves:0,lock:false};
 const cards=sh(q.flatMap(x=>[{c:x.c,h:lc(x)},{c:x.c,h:x.e+"<small>"+x.w+"</small>"}]));
 $("#stage").innerHTML='<div class="ins">Flip two flowers to find each letter and its picture. <b id="mv">Moves: 0</b></div><div class="mem">'+cards.map((x,i)=>'<button class="card"><div class="in"><div class="fa">'+MB+'<b class="nm">'+(i+1)+'</b></div><div class="fb">'+x.h+'</div></div></button>').join("")+'</div><div class="hint" id="hint"></div>';
 document.querySelectorAll(".card").forEach((b,i)=>b.onclick=()=>mFlip(b,cards[i]))}
function mFlip(b,c){if(st.lock||b.classList.contains("up"))return;b.classList.add("up");st.open.push([b,c]);if(st.open.length<2)return;
 st.moves++;$("#mv").textContent="Moves: "+st.moves;const[[b1,c1],[b2,c2]]=st.open;st.open=[];
 if(c1.c===c2.c){[b1,b2].forEach(x=>x.classList.add("ok"));const r=b2.getBoundingClientRect();spark(r.left+30,r.top+30,10);win(r.left+30,r.top+30);M.add(c1.c);upd();hint("");$("#hint").innerHTML='<span class="ok">You found a pair! 🎉❤️</span>';if(--st.left==0)tm.push(setTimeout(done,900))}
 else{st.lock=true;hint("Not a pair. Remember where they are and try again!");tm.push(setTimeout(()=>{[b1,b2].forEach(x=>{x.classList.remove("up");wig(x)});st.lock=false},1000))}}

/* Teacher dashboard (silent, no audio) */
$("#tb").onclick=()=>{const T=P.reduce((a,b)=>a+b,0);$("#tbx").innerHTML='<h2>Teacher Dashboard</h2><div class="kp"><div><b>'+T+'</b>Total stars</div><div><b>'+M.size+' / 13</b>Letters learned</div></div><div class="ac">'+NAMES.map((n,i)=>'<div><span>'+n+'</span><span><b>'+P[i]+'</b> completed</span></div>').join("")+'</div><div class="ch">'+L.map(o=>'<i class="'+(M.has(o.c)?"on":"")+'">'+o.c+'</i>').join("")+'</div><button class="cb o" id="rp">Reset all progress</button><button class="cb g" id="cl">Close</button>';$("#teach").style.display="flex";$("#cl").onclick=()=>$("#teach").style.display="none";$("#rp").onclick=()=>{P.fill(0);M.clear();$("#teach").style.display="none";start()}};
start();
</script></body></html>
